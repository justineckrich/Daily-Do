<title>Daily Do Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Superlist-style dark panel on a darker frame, with a sidebar of lists. Today opens with the heavy day title,
   a wavy divider, One Thing as a raised row, Top 3, meetings, then what else is on today. Deliberately dark-only. */
:root {
  --frame: #15161d;
  --panel: #1f202b;
  --raise: #2a2b38;
  --raise-2: #343545;
  --line: #2f3040;
  --ink: #f4f4f7;
  --ink-soft: #9092a6;
  --ink-faint: #5e6072;
  --brand: #f9503a;
  --brand-soft: #ff7a66;
  --wave: #dcd35c;
  --ok: #1fbf75;
  --s-gmail: #f27a6b;
  --s-slack: #c792ea;
  --s-asana: #f06a99;
  --s-ticktick: #4f8ef7;
  --s-fellow: #3fc1a5;
  --s-claude: #e0925f;
  --s-project: #dcd35c;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --side-w: 232px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--frame); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 40px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 13px; height: 13px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Shell: sidebar + panel */
.shell { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); gap: 16px; align-items: start; }
.shell.collapsed { grid-template-columns: minmax(0, 1fr); max-width: 680px; }
.shell.collapsed .side { display: none; }
.side { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 18px; padding: 16px 8px; max-height: calc(100dvh - 24px); overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: -0.01em; padding: 0 10px; }
.brand .mark { width: 22px; height: 22px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; font-size: 12px; }
nav.lists { display: grid; gap: 2px; }
.nav { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; text-align: left; font-size: 14.5px; font-weight: 600; color: var(--ink-soft); }
.nav svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav:hover { background: var(--panel); color: var(--ink); }
.nav[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.nav .n { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-faint); font-weight: 600; }
.nav .n.hot { color: var(--ink); background: var(--brand); border-radius: 999px; padding: 0 7px; }
.navsep { height: 1px; background: var(--line); margin: 6px 10px; }
.sidefoot { margin-top: auto; display: grid; gap: 10px; padding: 0 10px; }
.sidefoot .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.scrim { display: none; }

.panel {
  min-width: 0; background: var(--panel); border-radius: 20px;
  padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 28px;
}
@media (min-width: 560px) { body { padding-inline: 24px; } .panel { padding: 20px 36px 36px; } }
.topline { display: flex; align-items: center; gap: 10px; margin-bottom: -12px; }
.burger { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--raise); color: var(--ink-soft); display: grid; place-items: center; flex: none; }
.burger:hover { color: var(--ink); background: var(--raise-2); }
.burger svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }

/* Title */
header.day { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h1 { font-size: clamp(34px, 9vw, 46px); line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; margin: 0; text-wrap: balance; }
.sub { font-size: 15px; color: var(--ink-soft); margin-top: 10px; font-variant-numeric: tabular-nums; }
.sub b { color: var(--brand); font-weight: 700; }
.round-btns { display: flex; gap: 6px; padding-top: 6px; }
.round-btns button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--raise); color: var(--ink-soft); font-size: 16px; display: grid; place-items: center; }
.round-btns button:disabled { opacity: .35; cursor: default; }
.round-btns .refresh { width: auto; border-radius: 999px; padding: 0 13px; font-size: 13px; font-weight: 700; gap: 6px; display: inline-flex; align-items: center; color: var(--ink); }
.round-btns .refresh:hover { background: var(--raise-2); }
.round-btns .refresh:disabled { opacity: .7; }
.donetoday { font-size: 13px; color: var(--ink-faint); margin: 6px 0 0; }
.donetoday b { color: var(--ink-soft); font-weight: 600; }
.titlewrap { display: flex; flex-direction: column; gap: 14px; }
.wave { display: block; width: min(100%, 420px); height: 14px; }
.brief { font-size: 15px; color: var(--ink-soft); margin: 0; max-width: 60ch; }
.planbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-faint); }
.planbar:empty { display: none; }
.planbar .sep { opacity: .6; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-soft); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-faint); }
.linkbtn:hover { color: var(--ink); }
.linkbtn.warn { color: var(--brand-soft); }

/* Sections */
section { display: flex; flex-direction: column; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; }
h2 .count { font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--raise); border-radius: 6px; padding: 1px 7px; font-variant-numeric: tabular-nums; }

.task { display: flex; gap: 14px; padding: 11px 0; align-items: flex-start; }
.check {
  flex: none; width: 21px; height: 21px; margin-top: 2px; border-radius: 50%;
  border: 1.6px solid var(--ink-faint); background: transparent; padding: 0; display: grid; place-items: center;
}
.check:hover { border-color: var(--ink-soft); }
.check.urgent { border-color: var(--brand); }
.check[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }
.check[aria-pressed="true"]::after { content: ""; width: 8px; height: 4.5px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateY(-1px) rotate(-45deg); }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.body input.text { font-weight: 500; background: transparent; border: 0; outline: none; padding: 0; width: 100%; text-overflow: ellipsis; }
.body input.text::placeholder { color: var(--ink-faint); }
.body input.text:focus { box-shadow: 0 1px 0 var(--ink-faint); }
.task.is-done .body input.text, .loop.is-done .title { color: var(--ink-faint); text-decoration: line-through; }
.why { font-size: 14px; color: var(--ink-soft); }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--ink-soft); }
.meta-row > span, .meta-row > a { display: inline-flex; align-items: center; gap: 5px; }
.meta-row a { text-decoration: none; }
.meta-row a:hover { color: var(--ink); text-decoration: underline; }
.meta-row .hot { color: var(--brand-soft); font-weight: 600; }
.src { font-weight: 600; color: var(--ink); opacity: .85; }
.src::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--ink-faint)); }
.src[data-s="Gmail"] { --dot: var(--s-gmail); } .src[data-s="Slack"] { --dot: var(--s-slack); }
.src[data-s="Asana"] { --dot: var(--s-asana); } .src[data-s="TickTick"] { --dot: var(--s-ticktick); }
.src[data-s="Fellow"] { --dot: var(--s-fellow); } .src[data-s="Claude"] { --dot: var(--s-claude); }
.src[data-s="Project"] { --dot: var(--s-project); } .src[data-s="You"] { --dot: var(--ink-soft); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.mini {
  border: 0; background: var(--raise); color: var(--ink-soft); border-radius: 999px;
  padding: 3px 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-decoration: none;
}
.mini:hover { color: var(--ink); background: var(--raise-2); }
.mini:disabled { opacity: .35; cursor: default; }
.mini.primary { background: var(--brand); color: var(--ink); }
.mini.primary:hover { background: var(--brand-soft); }
.mini[aria-pressed="true"] { background: var(--ink); color: var(--frame); }
.tools .lbl { font-size: 12px; color: var(--ink-faint); font-weight: 600; }

/* One Thing */
.one { background: var(--raise); border-radius: 14px; padding: 14px 16px; position: relative; overflow: hidden; }
.one::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand); }
.one .kicker { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); margin-bottom: 6px; }
.one .task { padding: 0; }
.one .body input.text { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; }
.one .placeholder { font-size: 17px; font-weight: 600; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; flex: none; display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: sp .9s linear infinite; } }
@keyframes sp { to { transform: rotate(360deg); } }

/* List rows */
.loop { display: flex; gap: 14px; padding: 11px 0; align-items: flex-start; border-top: 1px solid var(--line); }
.loop:first-of-type { border-top: 0; }
.pill { flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; border-radius: 5px; padding: 0 5px; border: 1px solid transparent; font-variant-numeric: tabular-nums; }
.p0 { background: var(--brand); color: var(--ink); }
.p1 { border-color: var(--brand); color: var(--brand-soft); }
.p2 { background: var(--raise); color: var(--ink-soft); }
.p3 { border-color: var(--line); color: var(--ink-faint); }
.loop .title { font-weight: 500; overflow-wrap: anywhere; }
.loop .title a { text-decoration: none; }
.loop .title a:hover { text-decoration: underline; text-decoration-color: var(--brand); }
.act { font-size: 14px; color: var(--ink-soft); }
.act b { color: var(--ink); font-weight: 600; }
.new { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-soft); }
.more { align-self: flex-start; margin-top: 6px; }
.empty { font-size: 14px; color: var(--ink-faint); padding: 8px 0; margin: 0; }
.detail { font-size: 14px; color: var(--ink-soft); max-width: 62ch; overflow-wrap: anywhere; }
.hist { list-style: none; margin: 6px 0 0; padding: 0 0 0 10px; border-left: 2px solid var(--line); display: grid; gap: 3px; font-size: 13px; color: var(--ink-soft); }
.hist b { color: var(--ink); font-weight: 600; }
.noteform { display: flex; gap: 6px; margin-top: 6px; }
.noteform input { flex: 1; min-width: 0; background: var(--raise); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 14px; outline: none; }
.syncerr { color: var(--brand-soft); font-weight: 600; }
.add { display: flex; gap: 14px; align-items: center; padding: 8px 0 0; }
.add .plus { width: 21px; height: 21px; border-radius: 50%; border: 1.6px dashed var(--ink-faint); display: grid; place-items: center; color: var(--ink-faint); font-size: 14px; flex: none; }
.add input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 6px 0; font-weight: 500; }
.add input::placeholder { color: var(--ink-faint); }
.add input:focus { box-shadow: 0 1px 0 var(--ink-faint); }

/* Meetings */
.mt { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.mt:first-of-type { border-top: 0; }
.mt .tm { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; font-weight: 600; }
.mt .tt { font-weight: 500; overflow-wrap: anywhere; }
.mt .tt a { text-decoration: none; }
.mt .tt a:hover { text-decoration: underline; }
.mt .who { font-size: 13px; color: var(--ink-soft); }
.mt.past { opacity: .45; }
.mt.now .tm { color: var(--brand-soft); }
.mt .join { font-size: 12px; font-weight: 700; text-decoration: none; background: var(--raise); padding: 3px 10px; border-radius: 999px; color: var(--ink); }
.mt .join:hover { background: var(--brand); }
.dayh { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin: 14px 0 2px; }
.dayh:first-child { margin-top: 0; }

/* Priority engine: lanes, mix bar, caps (values from the Round spec) */
.lane-chip { display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:10px; font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; cursor:pointer; border:0; font-family:inherit; }
.lane-acquire    { background:rgba(34,197,94,.15);  color:#4ADE80; }
.lane-retention  { background:rgba(59,130,246,.15); color:#60A5FA; }
.lane-management { background:rgba(245,158,11,.15); color:#FBBF24; }
.lane-life       { background:rgba(156,163,175,.15); color:#D1D5DB; }
.lane-none       { background:transparent; color:var(--ink-faint); box-shadow: inset 0 0 0 1px var(--line); }
.mix { display:grid; gap:8px; }
.mix-wrap { position:relative; }
.mix-bar { display:flex; height:8px; border-radius:4px; overflow:hidden; background:rgba(255,255,255,.06); }
.mix-bar > span { height:100%; transition:width .3s ease; }
.mix-acquire { background:#22C55E; } .mix-retention { background:#3B82F6; } .mix-management { background:#F59E0B; }
.mix-target-tick { position:absolute; top:-3px; width:2px; height:14px; background:#FFFFFF; opacity:.6; }
.mix-label { font-size:13px; color:var(--ink-soft); margin:0; }
.cap-count { font-size:12px; font-variant-numeric:tabular-nums; color:#9CA3AF; font-weight:500; letter-spacing:0; }
.cap-count.full { color:#F87171; font-weight:600; }
.scale { display:inline-flex; align-items:center; gap:4px; }
.scale .mini { min-width:26px; justify-content:center; }
.settings { display:grid; gap:8px; padding:12px; background:var(--panel); border-radius:12px; }
.settings label { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); }
.settings input { width:64px; background:var(--raise); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:14px; outline:none; }
.gear { display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; color:var(--ink-faint); font-size:12px; padding:4px 8px; margin:0 -8px; border-radius:8px; }
.gear:hover { background:var(--panel); color:var(--ink); }
.gear svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; }
.lifehead { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; padding:0; text-align:left; }
@media (prefers-reduced-motion: reduce) { .mix-bar > span { transition:none; } }

/* Search */
.searchbox { position: relative; padding: 0 2px; }
.searchbox input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 30px 8px 32px; font-size: 14px; outline: none; }
.searchbox input:focus { border-color: var(--ink-faint); }
.searchbox input::placeholder { color: var(--ink-faint); }
.searchbox .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--ink-faint); fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.searchbox .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--ink-faint); font-size: 16px; width: 24px; height: 24px; border-radius: 6px; }
.searchbox .clear:hover { color: var(--ink); }
.sres { display: flex; flex-direction: column; gap: 3px; padding: 11px 0; border-top: 1px solid var(--line); }
.sres:first-of-type { border-top: 0; }
.sres .title { font-weight: 500; overflow-wrap: anywhere; }
.sres .title a { text-decoration: none; }
.sres .title a:hover { text-decoration: underline; text-decoration-color: var(--brand); }
.sres .snip { font-size: 14px; color: var(--ink-soft); overflow-wrap: anywhere; }

/* Turn into an Asana task */
.asform { display: grid; gap: 8px; margin-top: 8px; padding: 12px; background: var(--raise); border-radius: 12px; max-width: 520px; }
.asform label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.asform input, .asform select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; outline: none; color: var(--ink); min-width: 0; }
.asform input:focus, .asform select:focus { border-color: var(--ink-faint); }
.asform .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
@media (max-width: 420px) { .asform .row2 { grid-template-columns: minmax(0, 1fr); } }
.asform .err { font-size: 13px; color: var(--brand-soft); font-weight: 600; }

/* Projects */
.projrow { border-top: 1px solid var(--line); }
.projrow:first-of-type { border-top: 0; }
.projhead { display: flex; gap: 12px; align-items: center; padding: 12px 0; width: 100%; background: none; border: 0; text-align: left; }
.projhead .nm { font-weight: 700; font-size: 16px; }
.projhead .st { font-size: 13px; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; font-variant-numeric: tabular-nums; }
.projhead .st .hot { color: var(--brand-soft); font-weight: 600; }
.projhead .chev { margin-left: auto; color: var(--ink-faint); font-size: 18px; }
.projbody { padding: 0 0 10px 16px; border-left: 2px solid var(--line); margin-left: 4px; }

textarea {
  width: 100%; min-height: 120px; resize: vertical; color: var(--ink);
  background: transparent; border: 0; padding: 4px 0; outline: none; line-height: 1.6;
}
textarea::placeholder { color: var(--ink-faint); }

.notice { background: var(--raise); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.notice.bad { box-shadow: inset 3px 0 0 var(--brand); }
#notices { display: grid; gap: 8px; }
.sources { display: grid; gap: 5px; font-size: 12px; color: var(--ink-faint); }
.sources span { display: inline-flex; align-items: center; gap: 6px; }
.sources button { display: flex; align-items: center; gap: 6px; width: calc(100% + 16px); margin: 0 -8px; padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; font-size: 12px; text-align: left; color: inherit; }
.sources button:hover { background: var(--panel); color: var(--ink); }
.sources button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.sources .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }
.sources [data-s="ok"] .dot { background: var(--ok); }
.sources [data-s="err"] { color: var(--brand-soft); }
.sources [data-s="err"] .dot { background: var(--brand); }
@media (prefers-reduced-motion: no-preference) { .sources [data-s="load"] .dot { animation: pulse 1.2s infinite; } }
@keyframes pulse { 50% { opacity: .3; } }

/* Capture bar: pinned to the bottom of the panel on every screen */
.capture { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; margin-top: -8px; }
.capture form { display: flex; gap: 8px; align-items: center; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.capture .plus { color: var(--ink-soft); font-size: 18px; line-height: 1; }
.capture input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; padding: 6px 0; }
.capture input::placeholder { color: var(--ink-soft); }
.capture .send { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--brand); color: var(--ink); display: grid; place-items: center; }
.capture .send:hover { background: var(--brand-soft); }
.capture .send:disabled { opacity: .7; cursor: default; }
.capture .send svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.newproj { display: flex; gap: 8px; align-items: center; margin: 4px 0 6px; }
.newproj input { flex: 1; min-width: 0; background: var(--raise); border: 0; border-radius: 8px; padding: 7px 10px; font-size: 14px; outline: none; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--frame); border-radius: 999px; padding: 8px 8px 8px 16px; max-width: calc(100% - 32px);
  display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- state ----------
   db layout (owner-only):
     digest/latest     written by the 5:14am "Command Deck morning sweep" task (Claude chats + projects)
     plans/<date>      { generatedAt, brief, one, top3[3], map{itemKey:{b,p,a,j}}, notes }   b = today|week|waiting|backlog|drop
     state/cleared     { map{itemKey: ms} }  items checked off (kept for older copies of the page)
     overrides/<key>   { list?, done?, doneAt?, title, src, url, raw?, history[{at,by,text}], syncError? }  moves, check-offs, notes
     items/<id>        { title, list, note?, url?, due?, by, createdAt, done, doneAt?, history[] }  added by Justin or by Claude
     state/fellowLinks { map{noteNumber: url} }  Fellow meeting-notes links, looked up once per meeting
     projects/<id>     { name, from{key,src,url,title,list}, createdAt, archived, finishedAt?, history[] }  made with Move → Projects
   An item moved to Projects gets list "project" (overrides/<key> or items/<id>) so it leaves every list. */
const S = {
  view: VIEWS.some((v) => v.id === store.get("view", "today")) ? store.get("view", "today") : "today",
  sideOpen: store.get("side", true),
  today: ymd(0), date: ymd(0),
  bySource: {}, srcDone: new Set(), status: {}, events: [], asana: { mine: [], out: [] },
  digest: null, plan: undefined, cleared: {}, ov: {}, items: {}, projects: {},
  srcFilter: null, refreshing: false,
  settings: null, settingsOpen: false, mix: null, swap: null, cutsOpen: false, laneSorting: false, laneSortTried: false,
  fellowLinks: {}, search: null, team: null, asanaOpen: new Set(), asanaDraft: {}, asanaBusy: new Set(), asanaErr: {},
  db: null, mcp: null, sample: null,
  planning: false, planErr: "", attempted: new Set(), sortingNew: false,
  open: {}, expanded: new Set(), moving: new Set(), openProj: new Set(), pending: new Map(),
  confirmReplan: false, bootAt: Date.now(),
};

function sourceItems() {
  const seen = new Set(), out = [];
  for (const arr of Object.values(S.bySource)) for (const it of arr) { if (seen.has(it.key)) continue; seen.add(it.key); out.push(it); }
  return out;
}
function sourcesIn() { return SOURCES.every((s) => S.srcDone.has(s.key)); }
function isToday() { return S.date === S.today; }
function isTomorrow() { return S.date === shiftDate(S.today, 1); }
function canPlan() { return isToday() || isTomorrow(); }

/* ---------- everything in one list ---------- */
function loopEntries() {
  const d = S.digest || {}, out = [];
  for (const t of d.threads || []) out.push({ key: "h:" + hashKey(t.url || t.title), src: "Claude", kind: "loop", title: t.title, a: t.nextStep || "",
    detail: t.openLoop || "", url: t.url || "", date: Date.parse(t.updatedAt) });
  for (const p of d.projects || []) out.push({ key: "c:" + hashKey(p.name), src: "Claude", kind: "loop", idea: true, title: p.name, a: p.nextStep || "",
    detail: p.status || "", url: "", date: Date.parse(p.lastTouched) });
  return out;
}
function itemEntries() {
  return Object.entries(S.items).filter(([, d]) => d && d.list !== "removed").map(([id, d]) => ({ key: "it:" + id, id, manual: true, src: d.by === "Claude" ? "Claude" : "You", kind: "manual",
    title: d.title || "", detail: d.note || "", url: d.url || "", due: d.due || null, a: d.nextStep || "",
    date: Date.parse(d.updatedAt || d.createdAt), list: d.list || "today", done: !!d.done, fromNotes: d.from === "notes" }));
}
function planEntry(key) { return S.plan && S.plan.map ? S.plan.map[key] : null; }
function bucketToList(t) {
  if (!t) return null;
  if (t.b === "needs_you") return t.p === 0 ? "today" : "week";   // plans made before the sidebar
  if (t.b === "radar") return "backlog";
  if (t.b === "drop") return "drop";
  return LISTS[t.b] ? t.b : null;
}
function fallbackList(e) {
  if (e.kind === "out") return "waiting";
  const n = daysUntil(e.due);
  if (n != null && n <= 0) return "today";
  if (n != null && n <= 7) return "week";
  if (e.date && Date.now() - e.date > 21 * 864e5) return "backlog";
  if (e.src === "TickTick" && n == null) return "backlog";
  return "week";
}
function isDone(e) { return e.manual ? e.done : !!(S.cleared[e.key] || (S.ov[e.key] && S.ov[e.key].done)); }
function placeOf(e) {
  if (S.pending.has(e.key)) return S.pending.get(e.key);
  if (isDone(e)) return "done";
  if (e.manual) return e.list;
  const ov = S.ov[e.key];
  if (ov && ov.list) return ov.list;
  if (e.kind === "loop") return "loops";
  const t = bucketToList(planEntry(e.key));
  if (t === "drop") return null;
  if (!t && e.src === "Gmail") return null;
  return t || fallbackList(e);
}
function entries() {
  const list = [...sourceItems(), ...loopEntries(), ...itemEntries()];
  for (const e of list) {
    if (e.src === "Fellow" && !e.url && e.raw && S.fellowLinks[e.raw.noteId]) e.url = S.fellowLinks[e.raw.noteId];
    const t = planEntry(e.key);
    if (t) { e.p = t.p; if (!e.a) e.a = t.a || ""; if (!e.project) e.project = t.j || ""; }
    e.fresh = !e.manual && e.kind !== "loop" && !!S.plan && !t;
    enrich(e);
    e.place = placeOf(e);
  }
  allocate(list);
  const have = new Set(list.map((e) => e.key));
  for (const [key, ov] of Object.entries(S.ov)) if (ov.done && !have.has(key)) list.push({ key, src: ov.src || "You", title: ov.title || "(item)", url: ov.url || "", raw: ov.raw || null, place: "done", ghost: true });
  return list;
}

/* ---------- toast & notices ---------- */
let toastTimer = null, toastUndo = null, toastAlt = null;
function say(msg, undo, ms, alt) {
  $("toastText").textContent = msg;
  toastUndo = undo || null; toastAlt = alt || null;
  $("toastBtn").hidden = !undo;

}
$("toastBtn").addEventListener("click", () => { if (toastUndo) toastUndo(); $("toast").hidden = true; toastUndo = null; });
$("toastBtn2").addEventListener("click", () => { if (toastAlt) toastAlt.fn(); $("toast").hidden = true; toastAlt = null; });
const extraNotes = [];
function note(msg) { extraNotes.push(msg); if (extraNotes.length > 3) extraNotes.shift(); render(); }

/* ---------- saving (one write at a time per doc, debounced, flushed when the page hides) ---------- */
const writers = {};
function writer(path) { return writers[path] ||= { timer: null, chain: Promise.resolve(), pending: null, busy: 0 }; }
function queueSet(path, data, delay) {
  const w = writer(path);
  w.pending = data;
  clearTimeout(w.timer);
  w.timer = setTimeout(() => flush(path), delay == null ? 700 : delay);
}
function flush(path) {
  const w = writer(path);
  clearTimeout(w.timer); w.timer = null;
  if (!w.pending || !S.db) return w.chain;
  const data = w.pending; w.pending = null; w.busy++;
  $("saved").textContent = "Saving…";
  w.chain = w.chain.then(() => S.db.doc(path).set(data)).then(
    () => { $("saved").textContent = "Saved"; },
    (e) => { $("saved").textContent = ""; say("Couldn't save: " + ((e && (e.message || e.code)) || "unknown error"), null, 10000); },
  ).finally(() => { w.busy--; });
  return w.chain;
}
function flushAll() { for (const p of Object.keys(writers)) flush(p); }
function busy(path) { const w = writers[path]; return !!(w && (w.timer || w.busy)); }
window.addEventListener("pagehide", flushAll);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });

const planPath = (d) => "plans/" + d;
function savePlan(delay) { if (S.plan) queueSet(planPath(S.date), clone(S.plan), delay); }
function saveCleared() { queueSet("state/cleared", { map: clone(S.cleared) }, 300); }
function withHistory(cur, text) { return text ? [...((cur && cur.history) || []), { at: nowIso(), by: "Justin", text }].slice(-40) : (cur && cur.history) || []; }
function saveOv(key, patch, text) {
  const cur = S.ov[key] || {};
  S.ov[key] = { ...cur, ...patch, updatedAt: nowIso(), history: withHistory(cur, text) };
  queueSet("overrides/" + key, clone(S.ov[key]), 0);
  render();
}
function saveItem(id, patch, text) {
  const cur = S.items[id] || {};
  S.items[id] = { ...cur, ...patch, updatedAt: nowIso(), history: withHistory(cur, text) };
  queueSet("items/" + id, clone(S.items[id]), 0);
  render();
}
function saveProject(id, patch, text) {
  const cur = S.projects[id] || {};
  S.projects[id] = { ...cur, ...patch, updatedAt: nowIso(), history: withHistory(cur, text) };
  queueSet("projects/" + id, clone(S.projects[id]), 0);
  render();
}
const snap = (e) => ({ title: clip(e.title, 200), src: e.src, url: e.url || "", raw: e.raw || (S.ov[e.key] || {}).raw || null });

/* ---------- check off (everywhere), move, notes ---------- */
const pendingTimers = new Map();
function check(e) {
  if (S.pending.has(e.key)) { cancel(e.key); return; }
  if (e.place === "done") { putBack(e); return; }
  S.pending.set(e.key, e.place);
  const also = e.src === "Asana" || e.src === "TickTick" ? " Also in " + e.src + "." : "";
  pendingTimers.set(e.key, setTimeout(() => commit(e), COMMIT_MS));
  say("Done: " + clip(e.title, 44) + "." + also, () => cancel(e.key), COMMIT_MS);
  render();
}
function cancel(key) { clearTimeout(pendingTimers.get(key)); pendingTimers.delete(key); S.pending.delete(key); render(); }
function commit(e) {
  pendingTimers.delete(e.key); S.pending.delete(e.key);
  if (e.manual) { saveItem(e.id, { done: true, doneAt: nowIso() }, "Checked off"); markSlotsDone(e.key, true); return; }
  S.cleared[e.key] = Date.now(); saveCleared();
  saveOv(e.key, { ...snap(e), done: true, doneAt: nowIso(), syncError: null }, "Checked off");
  markSlotsDone(e.key, true);
  sync(e, true);
}
async function sync(e, completed) {
  if (!S.mcp || (e.src !== "Asana" && e.src !== "TickTick")) return;
  const raw = e.raw || (S.ov[e.key] || {}).raw || {};
  try {
    if (e.src === "Asana") {
      const gid = raw.gid || e.key.slice(3);
      const r = await S.mcp.callTool("Asana", "update_tasks", { tasks: [{ task: gid, completed }] });
      const p = payloadOf(r);
      if (p && Array.isArray(p.failed) && p.failed.length) throw { code: "tool_error" };
    } else {
      if (!completed) { note("Put back here. Reopen “" + clip(e.title, 50) + "” in TickTick too; this page can't reopen TickTick tasks."); return; }
      if (!raw.projectId || !raw.id) throw { code: "tool_error" };
      await S.mcp.callTool("TickTick", "complete_task", { project_id: raw.projectId, task_id: raw.id });
    }
    S.mcp.invalidate(e.src).catch(() => {});
  } catch (err) {
    const why = err && err.code === "needs_reauth" ? "reconnect " + e.src + " in Claude settings" : err && err.code === "not_in_manifest" ? e.src + " changes are turned off for this page" : "couldn't reach " + e.src;
    saveOv(e.key, { syncError: why });
    note("“" + clip(e.title, 50) + "” is " + (completed ? "done" : "back") + " here, but " + why + ". " + (completed ? "Retry it from Done." : "Reopen it there by hand."));
  }
}
function putBack(e) {
  if (e.manual) { saveItem(e.id, { done: false, doneAt: null }, "Put back"); markSlotsDone(e.key, false); return; }
  delete S.cleared[e.key]; saveCleared();
  saveOv(e.key, { done: false, doneAt: null, syncError: null }, "Put back");
  markSlotsDone(e.key, false);
  sync(e, false);
}
function retry(e) { saveOv(e.key, { syncError: null }); sync(e, true); }
function moveTo(e, list) {
  S.moving.delete(e.key);
  const wasFull = isFull(list, e.key);
  const mark = { list, movedBy: "justin", movedAt: nowIso() };
  if (e.manual) saveItem(e.id, mark, "Moved to " + LISTS[list]);
  else saveOv(e.key, { ...snap(e), ...mark }, "Moved to " + LISTS[list]);
  say("Moved to " + LISTS[list]);
  checkFull(list, e.key, wasFull);
}
function setList(key, id, list, text) {
  if (id) saveItem(id, { list }, text);
  else saveOv(key, { list }, text);
}
function moveToProject(e) {
  S.moving.delete(e.key);
  const id = "p-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const from = { key: e.key, src: e.src, url: e.url || "", title: clip(e.title, 200), list: e.place };
  saveProject(id, { name: clip(e.title, 120), from, createdAt: nowIso(), archived: false }, "Made a project");
  if (e.manual) saveItem(e.id, { list: "project" }, "Moved to Projects");
  else saveOv(e.key, { ...snap(e), list: "project" }, "Moved to Projects");
  say("Moved to Projects", () => { saveProject(id, { archived: true }, "Undone"); setList(e.key, e.manual ? e.id : null, from.list, "Moved back to " + LISTS[from.list]); });
}
function moveBack(p) {
  const f = p.from || {}, list = LISTS[f.list] ? f.list : "week";
  saveProject(p.id, { archived: true }, "Moved back to " + LISTS[list]);
  if (f.key) setList(f.key, f.key.startsWith("it:") ? f.key.slice(3) : null, list, "Moved back to " + LISTS[list]);
  say("Moved back to " + LISTS[list]);
}
function finishProject(p) {
  saveProject(p.id, { archived: true, finishedAt: nowIso() }, "Marked finished");
  say("Finished: " + clip(p.name, 40), () => saveProject(p.id, { archived: false, finishedAt: null }, "Reopened"));
}
function myProjects() {
  return Object.entries(S.projects).filter(([, p]) => p && !p.archived).map(([id, p]) => ({ ...p, id }))
    .sort((a, b) => (Date.parse(b.createdAt) || 0) - (Date.parse(a.createdAt) || 0));
}
function addNote(e, text) {
  text = text.trim(); if (!text) return;
  if (e.manual) saveItem(e.id, {}, text); else saveOv(e.key, snap(e), text);
}
function quickAdd(list, title) {
  title = title.trim(); if (!title) return;
  const id = "i-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const wasFull = isFull(list, "it:" + id);
  saveItem(id, { title, list, by: "Justin", createdAt: nowIso(), done: false, movedBy: "justin", movedAt: nowIso() }, "Added to " + LISTS[list]);
  checkFull(list, "it:" + id, wasFull);
}
function markSlotsDone(key, done) {
  if (!S.plan || !key) return;
  let hit = false;
  if (S.plan.one && S.plan.one.key === key && !!S.plan.one.done !== done) { S.plan.one.done = done; hit = true; }
  for (const s of S.plan.top3 || []) if (s && s.key === key && !!s.done !== done) { s.done = done; hit = true; }
  if (hit) savePlan(0);
}

/* ---------- connection status ---------- */
function setStatus(conn, s, msg, at) { S.status[conn] = { s, msg, at }; renderSources(); }
// Each tool in the sidebar is also a filter: tap it to see only that tool's items.
const FILTER_OF = { "Google Calendar": "Calendar", "Gmail": "Gmail", "Slack": "Slack", "Asana": "Asana", "TickTick": "TickTick", "Fellow.ai": "Fellow" };
function srcButton(f, state, label, title) {

    "aria-label": "Show only " + (f === "Claude" ? "Claude chats" : f) + " items", onclick: () => toggleSrc(f) }, h("span", { class: "dot" }), label);

function toggleSrc(f) {

}
function errCopy(e, server) {
  const name = SHORT[server] || server;
  switch (e && e.code) {
    case "needs_reauth": return "reconnect " + name + " in Claude settings";
    case "server_not_connected": case "server_not_found": return "add " + name + " in Claude settings";
    case "selection_required": return "pick which " + name + " account to use";
    case "not_in_manifest": return "turned off for this page";
    case "blocked_by_policy": case "approval_required": return "blocked by your organization";
    case "server_unavailable": return "didn't answer, will retry";
    case "tool_error": return clip((e && e.message) || "error", 60);
    case "not_granted": case "capability_disabled": return "not allowed here";
    default: return "couldn't load";
  }
}

/* ---------- live connector watches ---------- */
function startWatches() {
  const perConn = {};
  for (const src of SOURCES) (perConn[src.server] ||= []).push(src.key);
  for (const src of SOURCES) {
    S.mcp.watchTool(src.server, src.tool, src.input(), (ev) => {
      if (ev.type === "data") {
        let items = [];
        try { items = src.parse(payloadOf(ev.result)) || []; } catch (err) { console.warn(src.key, err); }
        S.bySource[src.key] = items.filter((i) => i.title);
        const at = ev.result && ev.result.cache ? ev.result.cache.storedAt : Date.now();
        S.srcDone.add(src.key);
        if (perConn[src.server].every((k) => S.srcDone.has(k))) setStatus(src.server, "ok", "", at);
        if (src.key === "fellow") fetchFellowLinks();
      } else {
        const e = ev.error || {};
        if (["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest", "not_granted"].includes(e.code)) { delete S.bySource[src.key]; if (src.key === "cal") S.events = []; }
        S.srcDone.add(src.key);
        setStatus(src.server, "err", errCopy(e, src.server));
      }
      render();
      maybePlan();
      maybeLaneSort();
    }, { cache: { staleTime: 5 * 60 * 1000, gcTime: 24 * 3600 * 1000 }, refetchInterval: POLL_MS });
  }
}

/* ---------- Fellow meeting-notes links ---------- */
let fellowFetching = false;
async function fetchFellowLinks() {
  if (fellowFetching || !S.mcp || !S.db) return;
  const want = new Map();
  for (const it of S.bySource.fellow || []) if (it.raw && it.raw.noteId && !(it.raw.noteId in S.fellowLinks)) want.set(it.raw.noteId, it.raw.at);
  if (!want.size) return;
  fellowFetching = true;
  let changed = false;
  try {
    for (const [id, at] of [...want].slice(0, 12)) {
      const day = dayOf(Date.parse(at) || Date.now());
      try {
        const r = await S.mcp.callTool("Fellow.ai", "search_meetings", { note_id: Number(id), from_date: shiftDate(day, -1), to_date: shiftDate(day, 1) });
        let p = payloadOf(r); const raw = p && p.result != null ? p.result : p;
        let arr = raw;
        if (typeof raw === "string") { const a = raw.indexOf("["), b = raw.lastIndexOf("]"); try { arr = JSON.parse(raw.slice(a, b + 1)); } catch { arr = []; } }
        const hit = (Array.isArray(arr) ? arr : []).find((m) => String(m.note_id) === String(id)) || (Array.isArray(arr) ? arr[0] : null);
        const url = hit && /^https:\/\/[\w.-]*fellow\.(app|link)\//.test(hit.url || "") ? hit.url : "";
        S.fellowLinks[id] = url; changed = true;
      } catch (e) { if (e && (e.code === "not_in_manifest" || e.code === "needs_reauth" || e.code === "not_granted")) break; }
    }
  } finally { fellowFetching = false; }
  if (changed) { queueSet("state/fellowLinks", { map: clone(S.fellowLinks) }, 300); render(); }
}
function urlForKey(key) {
  if (!key) return "";
  const it = sourceItems().find((x) => x.key === key);
  if (!it) return "";
  if (it.url) return it.url;
  return it.raw && S.fellowLinks[it.raw.noteId] || "";
}

/* ---------- Search: this page, then Slack, Gmail and Asana ---------- */
const STOP = new Set("the a an and or to of for in on with at by from is are be this that it as into via about their our your his her its them they we you have has had will can not but out all any more than then when what who how just also only very really".split(" "));
function keywordsOf(t, n) {
  const w = String(t || "").toLowerCase().replace(/[^a-z0-9\s'-]/g, " ").split(/\s+/).filter((x) => x.length > 3 && !STOP.has(x));
  return [...new Set(w)].sort((a, b) => b.length - a.length).slice(0, n || 3);
}
let searchTimer = null, searchSeq = 0;
function setSearch(q, fromItem) {
  q = String(q || "").trim();
  $("search").value = q; $("searchClear").hidden = !q;
  clearTimeout(searchTimer);
  if (q.length < 2) { if (S.search) { S.search = null; render(); } return; }
  S.search = { q, remote: {} };
  render();
  searchTimer = setTimeout(() => runRemote(q), fromItem ? 0 : 600);
}
async function runRemote(q) {
  if (!S.mcp) return;
  const seq = ++searchSeq;
  const words = q.split(/\s+/).filter(Boolean).slice(0, 5);
  const jobs = {
    Slack: () => S.mcp.callTool("Slack", "slack_search_public_and_private", { keywords: words, natural_language_query: q, limit: 10, include_context: false, sort: "score", max_context_length: 300 })
      .then((r) => parseSlackBlocks(payloadOf(r)).filter((m) => m.text).map((m) => ({ title: clip(m.text, 160), who: m.fromName, where: isDm(m) ? "Direct message" : m.channel, date: m.date, url: m.url }))),
    Gmail: () => S.mcp.callTool("Gmail", "search_threads", { query: q, pageSize: 10 })
      .then((r) => ((payloadOf(r) || {}).threads || []).map((t) => { const ms = t.messages || [], last = ms[ms.length - 1] || {}; return { title: decode(last.subject || (ms[0] && ms[0].subject) || "(no subject)"), who: senderName(last.sender), where: clip(decode(last.snippet), 160), date: Date.parse(last.date), url: t.viewUrl || last.viewUrl }; })),
    Asana: () => S.mcp.callTool("Asana", "search_tasks", { text: q, completed: false, limit: 10, opt_fields: "name,assignee.name,due_on,permalink_url,modified_at,projects.name" })
      .then((r) => ((payloadOf(r) || {}).data || []).map((t) => ({ title: t.name, who: t.assignee ? t.assignee.name : "", where: (t.projects || []).map((x) => x.name).filter(Boolean).join(", "), date: Date.parse(t.modified_at), due: t.due_on, url: t.permalink_url }))),
  };
  for (const [name, job] of Object.entries(jobs)) {
    S.search.remote[name] = { status: "load" };
    job().then((rows) => { if (seq === searchSeq && S.search) { S.search.remote[name] = { status: "ok", rows }; render(); } },
      (e) => { if (seq === searchSeq && S.search) { S.search.remote[name] = { status: "err", msg: errCopy(e, name) }; render(); } });
  }
  render();
}
function matches(e, words) {
  const hay = [e.title, e.detail, e.a, e.who, e.project, e.src].join(" ").toLowerCase();
  return words.every((w) => hay.includes(w));
}
function searchPage(page, all) {
  const q = S.search.q, words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const local = all.filter((e) => e.place && e.place !== "project" && matches(e, words));
  const mine = myProjects().filter((p) => words.every((w) => [p.name, (p.from || {}).title].join(" ").toLowerCase().includes(w)));
  const evs = S.events.filter((ev) => words.every((w) => [ev.title, ev.who].join(" ").toLowerCase().includes(w)));
  const box = h("div");
  if (!local.length && !mine.length && !evs.length) box.append(h("p", { class: "empty" }, "Nothing on this page matches."));
  for (const e of sortByPriority(local.filter((e) => e.place !== "done")).slice(0, 15)) box.append(row(e));
  for (const e of local.filter((e) => e.place === "done").slice(0, 5)) box.append(row(e, { noPill: true }));
  for (const p of mine) box.append(myProjectRow(p));
  page.append(h("section", null, h("h2", null, "On this page", h("span", { class: "count" }, String(local.length + mine.length))), box));
  if (evs.length) page.append(meetingsSection("Meetings", evs, true, ""));
  for (const name of ["Slack", "Gmail", "Asana"]) {
    const r = S.search.remote[name] || { status: S.mcp ? "load" : "err", msg: "not available here" };
    const b = h("div");
    if (r.status === "load") b.append(h("p", { class: "empty" }, h("span", { class: "spin", "aria-hidden": "true" }), " Searching " + name + "…"));
    else if (r.status === "err") b.append(h("p", { class: "empty" }, "Couldn't search " + name + ": " + r.msg + "."));
    else if (!r.rows.length) b.append(h("p", { class: "empty" }, "No matches in " + name + "."));
    else for (const x of r.rows) {
      const due = dueLabel(x.due);
      b.append(h("div", { class: "sres" },
        h("div", { class: "title" }, x.url ? h("a", { href: x.url, target: "_blank", rel: "noopener" }, x.title) : x.title),
        x.where ? h("div", { class: "snip" }, x.where) : null,
        h("div", { class: "meta-row" }, srcSpan(name), x.who ? h("span", null, icon("i-user"), x.who) : null,
          due ? h("span", { class: due.late ? "hot" : "" }, icon("i-cal"), due.text) : null, x.date ? h("span", null, ago(x.date)) : null, openLink(x.url))));
    }

  }
}

    S.team = ((payloadOf(r) || {}).data || []).filter((u) => u.gid !== ME_ASANA && u.name && !/@/.test(u.name)).sort((a, b) => a.name.localeCompare(b.name));

function asanaForm(e) {

function asanaNotes(e) {
  const url = e.url || urlForKey(e.key);
  return [e.title, e.detail && e.detail !== e.title ? e.detail : "", "From " + e.src + (e.who ? " (" + e.who + ")" : "") + (url ? ": " + url : ""), "Created from Daily Do Do."].filter(Boolean).join("\n\n");

async function createAsana(e, name, assignee, due, whoName) {
  if (!name || !S.mcp || S.asanaBusy.has(e.key)) return;
  S.asanaBusy.add(e.key); delete S.asanaErr[e.key]; render();
  try {
    const task = { name, assignee: assignee || "me", notes: asanaNotes(e) };
    if (due) task.due_on = due;
    const r = await S.mcp.callTool("Asana", "create_tasks", { tasks: [task] });
    const p = payloadOf(r) || {};
    if (Array.isArray(p.failed) && p.failed.length && !(p.succeeded || []).length) throw { code: "tool_error", message: clip(JSON.stringify(p.failed[0]), 120) };
    const made = (p.succeeded || [])[0] || {};
    const gid = String(made.gid || (made.task && made.task.gid) || made.task_gid || "");
    const url = made.permalink_url || (made.task && made.task.permalink_url) || (gid ? "https://app.asana.com/0/0/" + gid : "");
    const mine = !assignee || assignee === "me";
    const label = mine ? "you" : whoName;
    // The Asana task takes over from the original item.
    if (e.manual) saveItem(e.id, { done: true, doneAt: nowIso() }, "Turned into an Asana task for " + label);
    else { S.cleared[e.key] = Date.now(); saveCleared(); saveOv(e.key, { ...snap(e), done: true, doneAt: nowIso(), asana: { gid, url, assignee: label } }, "Turned into an Asana task for " + label); }
    if (S.plan && gid) {
      const swap = (x) => x && x.key === e.key ? { ...x, key: (mine ? "as:" : "ad:") + gid, src: "Asana", url, done: false } : x;
      S.plan.one = swap(S.plan.one); S.plan.top3 = (S.plan.top3 || []).map(swap); savePlan(0);
    }
    S.asanaOpen.delete(e.key); delete S.asanaDraft[e.key];
    S.mcp.invalidate("Asana").catch(() => {});
    say(mine ? "Created in Asana for you" : "Created in Asana for " + whoName + ". It's in Waiting On.");
  } catch (err) {
    S.asanaErr[e.key] = "Couldn't create it: " + errCopy(err, "Asana") + ".";
  } finally { S.asanaBusy.delete(e.key); render(); }
}

/* ---------- Capture: type anything, Claude files it ---------- */
function newItemId() { return "i-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function newProjectId() { return "p-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function addTask(title, list, due, text, extra) {

  saveItem(id, { title: clip(title, 200), list: where, due: /^\d{4}-\d{2}-\d{2}$/.test(due || "") ? due : null, by: "Justin", createdAt: nowIso(), done: false, movedBy: "justin", movedAt: nowIso(), ...(extra || {}) }, text);
  checkFull(where, "it:" + id, wasFull);

async function captureText(text) {
  text = String(text || "").trim();

- "project": he calls it a project, or it is clearly a multi-step initiative with no single next action.

"note": for a note, the note text, tidied.

Team (id | name):
${(S.team || []).map((u) => u.gid + " | " + u.name).join("\n") || "(not loaded)"}

${[...open.map((e, i) => "E" + (i + 1) + " | " + clip(e.title, 120)), ...mine.map((p, i) => "P" + (i + 1) + " | " + clip(p.name, 120))].join("\n") || "(none)"}

// Refresh reads new lines in the day's Notes and turns the to-dos into tasks. Each line is only read once.
async function notesToTasks() {
  if (!S.sample || !S.plan || !S.plan.notes) return 0;
  const seen = new Set(S.plan.notesSeen || []);
  const lines = S.plan.notes.split(/\n+/).map((l) => l.trim()).filter(Boolean);
  const fresh = lines.filter((l) => !seen.has(hashKey(l)));
  if (!fresh.length) return 0;
  const now = new Date().toLocaleString("en-US", { timeZone: TZ, weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const res = await S.sample.json(`Justin Eckrich (CEO of Appliance Repair Marketing) wrote these lines in his notes today. It is ${now} (Eastern), ${S.today}.
Pull out only the things Justin himself needs to do. Skip plain information, reminders of things already done, and anything someone else owns.
For each: "title" (verb first, his words, keep names and specifics), "list" ("today", "week" or "backlog"), "due" (YYYY-MM-DD if a day or date is given, else "").

Notes:
${fresh.map((l, i) => i + 1 + ". " + clip(l, 400)).join("\n")}

Reply with only JSON: {"tasks":[{"title":"...","list":"week","due":""}]}`, { modelTier: "quick", cache: false });
  const tasks = ((res && res.tasks) || []).slice(0, 10);
  for (const t of tasks) if (t && t.title) addTask(t.title, t.list, t.due, "Pulled from your notes", { from: "notes" });
  S.plan.notesSeen = [...seen, ...fresh.map(hashKey)].slice(-300);
  savePlan(0);
  return tasks.length;
}

/* ---------- Ask Claude: open a new Claude chat with the item's context filled in ---------- */
const ARTIFACT_URL = "https://claude.ai/artifact/4KnrRr7gBXuH35DZ4oqAAG";
function planRole(key) {
  if (!key || !S.plan || !isToday()) return "";
  if (S.plan.one && S.plan.one.key === key && S.plan.one.title) return "It's my One Thing today.";
  return (S.plan.top3 || []).some((x) => x && x.key === key && x.title) ? "It's in my Top 3 today." : "";
}
function historyLines(hist) {
  return (hist || []).slice(-8).map((x) => "- " + new Date(Date.parse(x.at)).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: TZ }) + " · " + (x.by || "Justin") + ": " + clip(x.text, 200));
}
function askText(o) {
  const lines = ["I'm working on this from my Daily Do Do workspace and want your help with it.", "", (o.kind || "Item") + ": " + o.title];
  if (o.next && o.next !== o.title) lines.push("Next step: " + o.next);
  if (o.src) lines.push("From: " + (o.src === "You" ? "added by me" : o.src) + (o.who ? " (" + o.who + ")" : "") + (o.url ? " " + o.url : ""));
  const where = [o.list ? "On my " + o.list + " list" : "", o.p != null ? "priority P" + o.p : "", o.due ? dueLabel(o.due) && dueLabel(o.due).text : ""].filter(Boolean).join(", ");
  if (where) lines.push(where + ".");
  if (o.role) lines.push(o.role);
  if (o.detail && o.detail !== o.title) lines.push("Details: " + clip(o.detail, 500));
  const hist = historyLines(o.history);
  if (hist.length) lines.push("History:", ...hist);
  lines.push("", "This came from Daily Do Do (" + ARTIFACT_URL + "). If we make progress or finish it, log it there with the Daily Do Do workspace skill (" + o.ref + ").", "", "My question: ");
  let text = lines.join("\n");
  if (text.length > 3500) text = text.slice(0, 3400) + "…\n\nMy question: ";
  return text;
}

    const late = rows.filter((e) => (daysUntil(e.due) ?? 1) < 0).length;
    const owners = [...new Set(g.tasks.map((t) => (t.assignee && t.assignee.gid !== ME_ASANA ? t.assignee.name : "You")))];
    const open = S.openProj.has(g.gid);
    const wrap = h("div", { class: "projrow" },
      h("button", { class: "projhead", type: "button", "aria-expanded": String(open), onclick: () => { open ? S.openProj.delete(g.gid) : S.openProj.add(g.gid); render(); } },
        h("div", null, h("div", { class: "nm" }, g.name),
          h("div", { class: "st" }, h("span", null, rows.length + " open"), late ? h("span", { class: "hot" }, late + " overdue") : null,
            h("span", null, owners.slice(0, 4).join(", ") + (owners.length > 4 ? " +" + (owners.length - 4) : "")), h("span", null, "active " + ago(g.last)))),
        h("span", { class: "chev", "aria-hidden": "true" }, open ? "–" : "+")));
    if (open) {
      const inner = h("div", { class: "projbody" }, h("div", { class: "tools", style: "margin:0 0 4px" }, openLink("https://app.asana.com/0/" + g.gid + "/list", "mini")));
      for (const e of sortByPriority(rows)) inner.append(row(e));
      wrap.append(inner);
    }
    box.append(wrap);
  }
  page.append(h("section", null, h("h2", null, "In Asana", h("span", { class: "count" }, String(G.length))), box));
}
function filterPage(page, all, loading) {
  const f = S.srcFilter;
  if (f === "Calendar") {
    page.append(meetingsSection("Meetings", S.events, true, S.srcDone.has("cal") ? "No meetings in the next 8 days." : "Loading your calendar…"));
    return;
  }
  const rows = all.filter((e) => e.src === f && e.place && LISTS[e.place]);
  if (!rows.length) page.append(h("p", { class: "empty" }, loading ? "Loading your tools…" : "No open " + (f === "Claude" ? "Claude chat" : f) + " items."));
  for (const [id, name] of Object.entries(LISTS)) {
    const L = rows.filter((e) => e.place === id);
    if (L.length) page.append(listSection("f-" + id, name, id === "waiting" ? L : sortByPriority(L), 10, "", { canTop: id !== "waiting" }));
  }
}

function paint() {
  const all = entries();
  const by = {}; for (const e of all) if (e.place) (by[e.place] ||= []).push(e);
  for (const k of CAPPED) if (by[k]) by[k].sort(byScore);
  const loading = !sourcesIn();
  const openPicks = S.plan && isToday() ? [S.plan.one, ...(S.plan.top3 || [])].filter((x) => x && x.title && !x.done).length : 0;
  const counts = { today: workOn(all, "today").length + openPicks, week: workOn(all, "week").length, waiting: (by.waiting || []).length, backlog: workOn(all, "backlog").length,
    loops: (by.loops || []).length, projects: projectGroups().length + myProjects().length, done: (by.done || []).length, parked: (by.parked || []).length,
    filter: S.srcFilter === "Calendar" ? S.events.length : all.filter((e) => e.src === S.srcFilter && e.place && LISTS[e.place]).length };
  renderNav(counts, (by.today || []).filter((e) => e.p === 0).length);
  renderHeader(counts);
  renderNotices();

  const page = $("page"); page.replaceChildren();
  const v = S.search ? "search" : S.srcFilter ? "filter" : S.view;
  if (v === "search") {
    searchPage(page, all);
  } else if (v === "filter") {
    filterPage(page, all, loading);
  } else if (v === "today") {
    if (isToday()) { const mb = mixBar(); if (mb) page.append(mb); const cs = cutsSection(all); if (cs) page.append(cs); }
    page.append(oneBox(), top3Section());
    if (isToday()) {
      page.append(listSection("today", "Next Up", workOn(all, "today"), 5, loading ? "Loading your tools…" : "Nothing else lined up. It fills from This Week as you finish things.", { add: "today", capOf: CAPS.today, capList: "today" }));
      page.append(lifeSection(lifeOn(all, "today"), "lifeToday", LIFE_CAPS.today));
    }
    const evs = S.events.filter((e) => e.day === S.date);
    const cal = S.status["Google Calendar"];
    page.append(meetingsSection("Meetings", evs, false, cal && cal.s === "err" ? "Calendar: " + cal.msg + "." : S.srcDone.has("cal") ? "No meetings." : "Loading your calendar…"));
    const notes = h("textarea", { id: "notes", "aria-label": "Notes", placeholder: S.plan ? "Anything you want to remember about this day." : "Notes open once the day is planned." });
    notes.value = (S.plan && S.plan.notes) || ""; notes.disabled = !S.plan;
    notes.addEventListener("input", () => { if (S.plan) { S.plan.notes = notes.value; savePlan(); } });
    page.append(h("section", null, h("h2", null, "Notes"), notes));
  } else if (v === "week") {
    { const mb = mixBar(); if (mb) page.append(mb); }
    page.append(listSection("week", "Up next", workOn(all, "week"), 12, loading ? "Loading your tools…" : "Nothing lined up for this week.", { add: "week", capOf: CAPS.week, capList: "week" }));
    page.append(lifeSection(lifeOn(all, "week"), "lifeWeek", LIFE_CAPS.week));
    page.append(meetingsSection("Meetings", S.events.filter((e) => e.day > S.today), true, S.srcDone.has("cal") ? "No meetings the rest of the week." : "Loading your calendar…"));
  } else if (v === "waiting") {
    const w = (by.waiting || []).slice().sort((a, b) => (a.date || 0) - (b.date || 0));
    page.append(listSection("waiting", "Oldest first", w, 15, loading ? "Loading your tools…" : "No one owes you anything right now.", { canTop: false, add: "waiting" }));
  } else if (v === "backlog") {
    page.append(listSection("backlog", "Highest score first", workOn(all, "backlog"), 20, loading ? "Loading your tools…" : "Backlog is empty.", { add: "backlog", capOf: CAPS.backlog, capList: "backlog" }));
    const lb = lifeOn(all, "backlog");
    if (lb.length) page.append(listSection("lifeBacklog", "Life, later", lb, 10, ""));
  } else if (v === "parked") {
    page.append(listSection("parked", "Parked", (by.parked || []), 25, "Nothing parked. Items land here when Backlog is full.", {}));
  } else if (v === "loops") {
    const L = (by.loops || []).slice().sort((a, b) => (b.date || 0) - (a.date || 0));
    page.append(listSection("chats", "Chats", L.filter((e) => e.kind === "loop" && !e.idea), 12, S.digest === null ? "Loading…" : "Nothing unfinished in your Claude chats. The 5:14am sweep refreshes this every morning."));
    page.append(listSection("ideas", "Ideas & started work", L.filter((e) => e.idea || e.kind !== "loop"), 12, "Nothing here yet.", { add: "loops" }));
  } else if (v === "projects") {
    projectsPage(page, all, loading);
  } else if (v === "done") {
    const D = (by.done || []).slice().sort((a, b) => doneAtOf(b) - doneAtOf(a));
    if (!D.length) page.append(h("p", { class: "empty" }, "Nothing checked off yet."));
    const groups = {}; for (const e of D) (groups[dayOf(doneAtOf(e) || Date.now())] ||= []).push(e);
    for (const [day, list] of Object.entries(groups)) {
      const label = day === ymd(0) ? "Today" : day === ymd(1) ? "Yesterday" : new Date(day + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
      page.append(listSection("done-" + day, label, list, 25, "", { noPill: true }));
    }
  }
}
function doneAtOf(e) { return Date.parse((S.ov[e.key] || {}).doneAt || (e.manual && S.items[e.id] ? S.items[e.id].doneAt : "")) || S.cleared[e.key] || 0; }

function render() {
  // Background refreshes redraw the page; keep whatever Justin is typing where it is.
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA") && ae.id ? { id: ae.id, value: ae.value, a: ae.selectionStart, b: ae.selectionEnd } : null;
  paint();
  if (typing) {
    const el = $(typing.id);
    if (el && el !== ae) { el.value = typing.value; el.focus(); try { el.setSelectionRange(typing.a, typing.b); } catch {} }
  }
}

/* ---------- navigation ---------- */
const wide = () => window.matchMedia("(min-width: 900px)").matches;
function applySide() { $("shell").classList.toggle("collapsed", wide() && !S.sideOpen); if (wide()) $("shell").classList.remove("open"); }
function go(v) {
  S.view = v; store.set("view", v);
  if (S.srcFilter) { S.srcFilter = null; renderSources(); }
  if (S.search) setSearch("");
  if (!wide()) $("shell").classList.remove("open");
  if (v === "today" && S.date !== S.today) goTo(S.today); else render();
  window.scrollTo({ top: 0 });
}
$("burger").addEventListener("click", () => {
  if (wide()) { S.sideOpen = !S.sideOpen; store.set("side", S.sideOpen); applySide(); }
  else $("shell").classList.toggle("open");
});
$("scrim").addEventListener("click", () => $("shell").classList.remove("open"));
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") $("shell").classList.remove("open"); });
window.addEventListener("resize", applySide);
function goTo(date) {
  if (date === S.date) return;
  flushAll();
  S.date = date; S.planErr = "";
  watchPlan();
  window.scrollTo({ top: 0 });
}
$("prevDay").addEventListener("click", () => goTo(shiftDate(S.date, -1)));
$("nextDay").addEventListener("click", () => { if (S.date < shiftDate(S.today, 1)) goTo(shiftDate(S.date, 1)); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const t = ymd(0);
  if (t !== S.today) { const wasToday = S.date === S.today; S.today = t; if (wasToday) goTo(t); }
  renderSources(); render(); maybePlan();
});
setInterval(() => { const t = ymd(0); if (t !== S.today) { const wasToday = S.date === S.today; S.today = t; if (wasToday) goTo(t); else render(); } else render(); renderSources(); }, 60000);

/* ---------- boot ---------- */
applySide(); renderSources(); render();
(async () => {
  const [mcp, sample, db] = await Promise.all([claude.use("mcp"), claude.use("sample"), claude.use("db")]);
  S.sample = sample || null;
  if (!sample) S.planErr = "off";
  if (db) { S.db = db; watchShared(); watchPlan(); }
  else { S.db = false; S.digest = {}; S.plan = null; render(); }
  if (!mcp) { S.mcp = false; for (const c of CONNECTORS) setStatus(c, "err", "not available here"); render(); }
  else { S.mcp = mcp; startWatches(); }
})();
})();
</script>
